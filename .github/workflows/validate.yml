name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install hassfest
        run: pip install hassfest

      - name: Validate manifest
        run: hassfest validate custom_components/apc_modbus/

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pymodbus>=3.1.1

      - name: Check imports
        run: |
          python -c "import custom_components.apc_modbus"
          python -c "from custom_components.apc_modbus import const"
